# The PowerShell module's configuration, beside the module. TOML, like
# everything Xmip configures — Xmip uses no JSON for configuration anywhere.
# The same keys as the GUI hosts' xmip.gui.toml and the executable's
# xmip.cli.toml, read by the same reader (ADR-0052).
#
# Paths are relative to this file's directory.

[Xmip]
# Which surface the prompt follows (ADR-0052 clause 3): "local", a node on
# this machine followed over gRPC at the local endpoint Local names (ADR-0014,
# amendment 2026-10-13), "snapshot", a file a node or the Playground
# publishes, or "remote", a node on another machine followed over gRPC at its
# operate Address. Stated here and never guessed from an environment
# variable or a file in a temp directory. With no surface named, the prompt
# names no node and shows nothing, as posh-git outside a repository.
#
# As shipped, in a developer's clone: the Playground roll the estate's own
# walkthrough starts, which names its cluster C1 only because a roll must be
# given some name. Roll under another name and name that file below, or let
# Start-XmipTest tell this session. A deployment writes its own.
Surface = "snapshot"

# The runtime's native library, exporting xmip_operate_v1: what the module
# calls the runtime through, the gRPC client among it.
# RuntimeLibrary = "../../../../../platform/runtime/target/debug/xmip_core_runtime.dll"

# The file to read when Surface = "snapshot". A path with no file behind it
# shows no segment, never another file's figures. A relative path
# is from the directory the module is loaded from, bin/Debug/net10.0 under
# this project: eight levels up is the estate root, where a roll publishes
# under .local-work/playground. The file is named for the cluster the roll was
# started as, so this line follows one particular roll and no other.
Snapshot = "../../../../../../../../../.local-work/playground/C1-snapshot.toml"

# The node on this machine to follow when Surface = "local": its local
# endpoint, as its [operate] local names it; the same serves -Local. The node
# takes every act as the user this session runs as.
# Local = "xmip-node1"

# The node to follow when Surface = "remote", at its operate address,
# host:port (ADR-0067); the prompt is told when its publication advances and
# shows nothing while it does not answer. The same keys serve -Remote.
# gRPC inside Xmip's mutual TLS, always: presenting Certificate with
# PrivateKey and taking the node only where its certificate reaches
# TrustAnchor (PEM files), each else XMIP_CERTIFICATE, XMIP_PRIVATE_KEY and
# XMIP_TRUST_ANCHOR (ADR-0063).
# Address = "node1:7401"
# Certificate = "surface.pem"
# PrivateKey = "surface.key"
# TrustAnchor = "anchor.pem"

# Where this module's audit records go (ADR-0062): every cmdlet failure, each
# pause and resume, and the prompt's failures, as <AuditDirectory>/audit.toml.
# Unset, the audit capability decides — XMIP_AUDIT_DIRECTORY, else the
# operating system's log.
# AuditDirectory = "../../../../../../../../../.local-work/audit"
